    <script>
      // Project opening function
      function openProject(projectName) {
        const projectUrls = {
          'Urban Geometry': 'urban-geometry.html',
          'Analog Dreams': 'analog-dreams.html'
          // Add more as you create the HTML files
        };
        
        const projectUrl = projectUrls[projectName];
        
        if (projectUrl) {
          // Navigate to project page
          window.location.href = projectUrl;
        } else {
          createComingSoonAlert(projectName);
        }
      }

      function createComingSoonAlert(projectName) {
        alert('The "' + projectName + '" project page is coming soon! Currently working on creating individual project galleries.');
      }
